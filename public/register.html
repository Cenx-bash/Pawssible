<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PetCareConnect - Register</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #555;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .error {
            display: block;
            background: #ffe5e5;
            color: #b00020;
        }

        .success {
            display: block;
            background: #e5ffe9;
            color: #087f23;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
        }

        .login-link a {
            color: #222;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>PetCareConnect</h1>

    <p class="subtitle">
        Create your account
    </p>

    <form id="registerForm">

        <!-- FIRST NAME -->
        <div class="form-group">
            <label for="first_name">
                First Name
            </label>

            <input
                type="text"
                id="first_name"
                name="first_name"
                required
            >
        </div>

        <!-- LAST NAME -->
        <div class="form-group">
            <label for="last_name">
                Last Name
            </label>

            <input
                type="text"
                id="last_name"
                name="last_name"
                required
            >
        </div>

        <!-- EMAIL -->
        <div class="form-group">
            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
            >
        </div>

        <!-- PHONE -->
        <div class="form-group">
            <label for="phone">
                Phone Number
            </label>

            <input
                type="text"
                id="phone"
                name="phone"
                placeholder="Optional"
            >
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                required
            >
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="form-group">
            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                required
            >
        </div>

        <button
            type="submit"
            id="registerButton"
        >
            Create Account
        </button>

    </form>

    <div
        id="message"
        class="message"
    ></div>

    <div class="login-link">
        Already have an account?
        <a href="/login">
            Login
        </a>
    </div>

</div>


<script>

/* =========================================================
   PETCARECONNECT API
   ========================================================= */

/*
   IMPORTANT:

   Replace this with your CURRENT Cloudflare Tunnel URL.

   Example:
   https://suggest-connecticut-nonprofit-translator.trycloudflare.com/api
*/

const API_URL =
    "https://suggest-connecticut-nonprofit-translator.trycloudflare.com/api";


/* =========================================================
   ELEMENTS
   ========================================================= */

const form =
    document.getElementById("registerForm");

const message =
    document.getElementById("message");

const button =
    document.getElementById("registerButton");


/* =========================================================
   SHOW MESSAGE
   ========================================================= */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;
}


/* =========================================================
   REGISTER
   ========================================================= */

form.addEventListener("submit", async function (event) {

    event.preventDefault();

    /* -----------------------------------------------------
       GET FORM VALUES
       ----------------------------------------------------- */

    const first_name =
        document
            .getElementById("first_name")
            .value
            .trim();

    const last_name =
        document
            .getElementById("last_name")
            .value
            .trim();

    const email =
        document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();

    const phone =
        document
            .getElementById("phone")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;

    const confirm_password =
        document
            .getElementById("confirm_password")
            .value;


    /* =====================================================
       VALIDATION
       ===================================================== */

    if (
        !first_name ||
        !last_name ||
        !email ||
        !password ||
        !confirm_password
    ) {

        showMessage(
            "Please fill in all required fields.",
            "error"
        );

        return;
    }


    /* EMAIL */

    const emailInput =
        document.getElementById("email");

    if (!emailInput.checkValidity()) {

        showMessage(
            "Please enter a valid email address.",
            "error"
        );

        return;
    }


    /* PASSWORD LENGTH */

    if (password.length < 8) {

        showMessage(
            "Password must be at least 8 characters.",
            "error"
        );

        return;
    }


    /* PASSWORD UPPERCASE */

    if (!/[A-Z]/.test(password)) {

        showMessage(
            "Password must contain at least one uppercase letter.",
            "error"
        );

        return;
    }


    /* PASSWORD NUMBER */

    if (!/[0-9]/.test(password)) {

        showMessage(
            "Password must contain at least one number.",
            "error"
        );

        return;
    }


    /* PASSWORD SPECIAL CHARACTER */

    if (!/[^A-Za-z0-9]/.test(password)) {

        showMessage(
            "Password must contain at least one special character.",
            "error"
        );

        return;
    }


    /* CONFIRM PASSWORD */

    if (password !== confirm_password) {

        showMessage(
            "Passwords do not match.",
            "error"
        );

        return;
    }


    /* =====================================================
       DISABLE BUTTON
       ===================================================== */

    button.disabled = true;

    button.textContent =
        "Sending OTP...";


    showMessage(
        "Creating your account and sending OTP...",
        "success"
    );


    /* =====================================================
       SEND REGISTRATION REQUEST
       ===================================================== */

    try {

        console.log(
            "Sending registration request to:",
            `${API_URL}/auth/register`
        );


        const response =
            await fetch(
                `${API_URL}/auth/register`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        first_name:
                            first_name,

                        last_name:
                            last_name,

                        email:
                            email,

                        phone:
                            phone,

                        password:
                            password

                    })
                }
            );


        /* =================================================
           READ RESPONSE
           ================================================= */

        let data;

        try {

            data =
                await response.json();

        } catch (jsonError) {

            console.error(
                "Invalid JSON response:",
                jsonError
            );

            throw new Error(
                "The server returned an invalid response."
            );
        }


        console.log(
            "Registration response:",
            data
        );


        /* =================================================
           SERVER ERROR
           ================================================= */

        if (!response.ok) {

            throw new Error(
                data.message ||
                data.error ||
                "Registration failed."
            );
        }


        /* =================================================
           SUCCESS
           ================================================= */

        console.log(
            "Registration successful:",
            data
        );


        /*
           Save the email.

           The OTP page can use this value.
        */

        sessionStorage.setItem(
            "registrationEmail",
            email
        );


        /*
           Save temporary registration information.

           DO NOT store the password here.
        */

        sessionStorage.setItem(
            "registrationName",
            `${first_name} ${last_name}`
        );


        /* =================================================
           SUCCESS MESSAGE
           ================================================= */

        showMessage(
            "OTP sent successfully! Check your email.",
            "success"
        );


        button.textContent =
            "OTP Sent";


        /* =================================================
           GO TO OTP PAGE
           ================================================= */

        setTimeout(function () {

            window.location.href =
                "/verify-otp";

        }, 1000);


    } catch (error) {

        console.error(
            "Registration error:",
            error
        );


        /* =================================================
           CONNECTION ERROR
           ================================================= */

        if (
            error instanceof TypeError &&
            error.message.includes("fetch")
        ) {

            showMessage(
                "Cannot connect to the server. Check that your Node.js server and Cloudflare Tunnel are running.",
                "error"
            );

        } else {

            showMessage(
                error.message ||
                "Registration failed. Please try again.",
                "error"
            );
        }


        /* =================================================
           ENABLE BUTTON AGAIN
           ================================================= */

        button.disabled = false;

        button.textContent =
            "Create Account";

    }

});


/* =========================================================
   DEBUG
   ========================================================= */

console.log(
    "PetCareConnect registration loaded."
);

console.log(
    "API URL:",
    API_URL
);

</script>

</body>
</html>
